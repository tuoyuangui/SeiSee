<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="icon-title">
  <title id="icon-title">SeiSee installer icon</title>

  <defs>
    <linearGradient id="rear-flap-left" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#f7c47b"/>
      <stop offset="1" stop-color="#c77c3c"/>
    </linearGradient>
    <linearGradient id="rear-flap-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7cc8b"/>
      <stop offset="1" stop-color="#cf8642"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#c37b3d"/>
      <stop offset="1" stop-color="#88502e"/>
    </linearGradient>
    <linearGradient id="left-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a252"/>
      <stop offset="1" stop-color="#ad622f"/>
    </linearGradient>
    <linearGradient id="right-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d58a3f"/>
      <stop offset="1" stop-color="#a95d2e"/>
    </linearGradient>
    <linearGradient id="front-flap-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdda0"/>
      <stop offset="1" stop-color="#d9934e"/>
    </linearGradient>
    <linearGradient id="front-flap-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edb36f"/>
      <stop offset="1" stop-color="#c27639"/>
    </linearGradient>

    <filter id="icon-shadow" x="-20%" y="-20%" width="145%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="5"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="seisee-app-icon">
      <rect width="512" height="512" rx="112" fill="#123779"/>
      <rect x="20" y="20" width="472" height="472" rx="104" fill="#294f91"/>
      <g fill="#fff">
        <g transform="translate(128)">
          <path d="M-9 130 -9 260H0c29-15 58-30 58-50 0-35-58-45-58-80Z"/>
          <path d="M0 82v48c0 35 58 45 58 80 0 20-29 35-58 50s-58 30-58 50c0 35 58 45 58 80v40"
                fill="none" stroke="#fff" stroke-width="18"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(256)">
          <path d="M-9 130 -9 260H0c29-15 58-30 58-50 0-35-58-45-58-80Z"/>
          <path d="M0 82v48c0 35 58 45 58 80 0 20-29 35-58 50s-58 30-58 50c0 35 58 45 58 80v40"
                fill="none" stroke="#fff" stroke-width="18"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(384)">
          <path d="M-9 130 -9 260H0c29-15 58-30 58-50 0-35-58-45-58-80Z"/>
          <path d="M0 82v48c0 35 58 45 58 80 0 20-29 35-58 50s-58 30-58 50c0 35 58 45 58 80v40"
                fill="none" stroke="#fff" stroke-width="18"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <clipPath id="icon-box-boundary" clipPathUnits="userSpaceOnUse">
      <path d="M0 0h512v280h-74l-18 79-195 93-138-92v-80H0Z"/>
    </clipPath>
  </defs>

  <g stroke-linejoin="round">
    <path d="m84.7208 189.14286-42.72078-31.57143 203.66882-48.57143 44.70779 27.52381Z"
          fill="url(#rear-flap-left)" stroke="#d8924e" stroke-width="3"/>
    <path d="m290.37663 136.52381 65.57143-44.52381 151.05194 67.76191-60.64285 53.66667Z"
          fill="url(#rear-flap-right)" stroke="#d99a58" stroke-width="3"/>
    <path d="m84.7208 189.14286 205.65583-52.61905 155.98051 76.90476-219.56492 65.57143Z"
          fill="url(#cavity)" stroke="#a86535" stroke-width="3"/>
  </g>

  <g clip-path="url(#icon-box-boundary)">
    <use xlink:href="#seisee-app-icon"
         transform="rotate(-10 256 200) translate(96 40) scale(.625)"
         filter="url(#icon-shadow)"/>
  </g>

  <path d="m86 194 139 85v173l-138-92Z"
        fill="url(#left-wall)" stroke="#aa632f" stroke-width="3"
        stroke-linejoin="round"/>
  <path d="m227 280.55331 219-65.57064-3 149.8774-216 87.13992Z"
        fill="url(#right-wall)" stroke="#a65d2e" stroke-width="3"
        stroke-linejoin="round"/>
  <path d="m225 279v173" fill="none" stroke="#98562d"
        stroke-opacity=".58" stroke-width="3"/>

  <path d="m83 191-72 33.65563 138 93.34437 77-38.05298Z"
        fill="url(#front-flap-left)" stroke="#f2c17e" stroke-width="4"
        stroke-linejoin="round"/>
  <path d="m448.59784 214 53.40218 68.68292-209.71742 74.31707-65.28262-74.90244Z"
        fill="url(#front-flap-right)" stroke="#e4ad70" stroke-width="4"
        stroke-linejoin="round"/>
</svg>
